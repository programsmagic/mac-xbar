name: Build and Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [created]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Lint
        run: |
          which swiftlint || echo "swiftlint not installed"
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --path Sources/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-xbar-build
          path: .build/release/mac-xbar
          retention-days: 30

  dmg:
    runs-on: macos-latest
    needs: build
    if: github.event_name == 'release' && github.event.action == 'created'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release

      - name: Create DMG
        run: bash create-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-xbar-dmg
          path: mac-xbar.dmg
          retention-days: 30

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mac-xbar.dmg
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: false

  deploy:
    runs-on: macos-latest
    needs: [build, dmg]
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release

      - name: Create DMG
        run: bash create-dmg.sh

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: mac-xbar.dmg
          tag: ${{ github.ref_name }}
          overwrite: true